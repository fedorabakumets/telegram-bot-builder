# @fileoverview Локальные сервисы конструктора: API исполняет рассылки, runtime управляет ботами.
# Запускает приложение и PostgreSQL базу данных одной командой
# Usage: docker compose up -d

services:
  # База данных PostgreSQL для хранения проектов и настроек
  db:
    image: postgres:15-alpine
    container_name: bot-builder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bot-builder-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Основное приложение (конструктор ботов)
  # image — прод/CI (GHCR); build — локальная разработка (docker compose build)
  app:
    image: ghcr.io/fedorabakumets/telegram-bot-builder:${IMAGE_TAG:-latest}
    build: .
    pull_policy: missing
    container_name: bot-builder-app
    restart: unless-stopped
    # 0 = без лимита (по умолчанию). На маленьких VPS задайте APP_MEM_LIMIT=1280m в .env
    mem_limit: ${APP_MEM_LIMIT:-0}
    memswap_limit: ${APP_MEM_LIMIT:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      PGHOST: "${PGHOST}"
      PGPORT: "${PGPORT}"
      PGDATABASE: "${PGDATABASE}"
      PGUSER: "${PGUSER}"
      PGPASSWORD: "${PGPASSWORD}"
      PGSSLMODE: "${PGSSLMODE}"
      SESSION_SECRET: "${SESSION_SECRET}"
      ADMIN_API_KEY: "${ADMIN_API_KEY}"
      NODE_ENV: "${NODE_ENV}"
      PORT: "${PORT}"
      HOST: "${HOST}"
      REDIS_URL: "${REDIS_URL}"
      # psql_query builtin (БД платформы) — только для однопользовательской установки
      PSQL_BUILTIN_ENABLED: "${PSQL_BUILTIN_ENABLED:-false}"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./bots:/app/bots

  # Раздельный локальный профиль: docker compose --profile split up --build db redis api runtime frontend.
  api:
    profiles: [split]
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      SESSION_SECRET: "${SESSION_SECRET}"
      ADMIN_API_KEY: "${ADMIN_API_KEY}"
      REDIS_URL: redis://redis:6379
      WORKER_RUNTIME: remote
      WORKER_RUNNER_ID: default
      BOT_RUNTIME_MODE: api
      BOT_ARTIFACT_SOURCE: storage
      BOT_BUILDS_STORAGE_ID: "${BOT_BUILDS_STORAGE_ID:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      APP_MODE: backend
      PORT: "5000"
      HOST: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  runtime:
    profiles: [split]
    build:
      context: .
      dockerfile: Dockerfile.runner
    environment:
      REDIS_URL: redis://redis:6379
      RUNNER_ID: default
      RUNNER_REQUIRE_FENCE: "true"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  frontend:
    profiles: [split]
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      BACKEND_URL: http://api:5000
      FRONTEND_PORT: "5173"
      HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:5000:5173"
    depends_on:
      - api

volumes:
  postgres_data:
    name: bot-builder-postgres-data
  redis_data:
    name: bot-builder-redis-data
