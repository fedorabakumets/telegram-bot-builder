<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <!-- Telegram передаёт данные Mini App до запуска приложения. -->
    <script id="telegram-mini-app-api" async src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta name="description" content="Создавайте Telegram боты без программирования с помощью визуального редактора" />
    
    <!-- Preload критические ресурсы -->
    
    <!-- DNS prefetch для внешних ресурсов -->
    <link rel="dns-prefetch" href="https://replit.com" />
    
    <!-- Улучшенное кеширование -->
    <meta http-equiv="Cache-Control" content="public, max-age=31536000" />
    
    <title>Telegram Bot Builder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
