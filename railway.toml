# Config-as-code сервиса панели на Railway (единственный конфиг, railway.json не используется).
# Образ собирается по корневому Dockerfile; переменные окружения (DATABASE_URL и др.)
# задаются в настройках сервиса, NODE_ENV=production выставляет скрипт start.

[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/api/health"
healthcheckTimeout = 60
