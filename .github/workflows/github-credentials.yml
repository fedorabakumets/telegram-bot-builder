# @fileoverview Запрещает встроенные GitHub-токены в отслеживаемых файлах.
name: GitHub credential guard
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test scripts/security/github-credential-patterns.test.mjs
      - run: node scripts/security/check-github-credentials.mjs
