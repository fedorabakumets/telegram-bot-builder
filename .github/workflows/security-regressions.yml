# @fileoverview Проверяет защиту входа, cookie-запросов, маршрутов пользователей и HTML редактора.
name: Security regressions

on:
  push:
    paths:
      - 'server/**'
      - 'client/components/editor/inline-rich/**'
      - 'package*.json'
      - '.github/workflows/security-regressions.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx vitest run --config server/admin/admin-login-rate-limit.vitest.config.ts
      - run: npx vitest run --config server/middleware/cookie-csrf.vitest.config.ts
      # Проверяем защиту до авторизации, безопасное логирование и изолированный webhook.
      - run: npx vitest run --config server/admin/runtime-settings-rate-limit.vitest.config.ts
      - run: npx vitest run --config server/routes/bot-runtime-rate-limit.vitest.config.ts
      - run: npx vitest run --config server/terminal/botLogsBuffer.security.vitest.config.ts
      - run: node --import tsx --test scripts/local-webhook/security.test.mjs
      - run: npx vitest run --config server/routes/storageConfigs/vitest.config.ts
      - name: Доступ, лимиты запросов и аватары пользователей ботов
        run: npx vitest run --config server/routes/userProjectsTokens/vitest.config.ts
      - name: Авторизация и потоковая передача файлов Telegram
        run: npx vitest run --config server/routes/botIntegration/handlers/botData/telegram-file.vitest.config.ts
      - name: Передача фотографии между ботами без сохранения
        run: npx tsx lib/tests/test-phase101-message-user-photo.ts
      - run: npx vitest run --config server/routes/media/vitest.backup-access.config.ts
      - run: npx vitest run --config client/components/editor/inline-rich/vitest.security.config.ts
      - run: npx vitest run lib/bot-tools/constants.test.ts
      - run: node --import tsx --test lib/api-docs/durable-table-contracts.test.ts
      - name: История проектов и сроки бэкапов
        run: |
          node --import tsx --test server/database/project-version-list.test.ts server/database/backups/dbBackupDue.test.ts server/database/backups/dbBackups.test.ts
          npx vitest run --config server/routes/projectRoutes/handlers/vitest.history.config.ts
          npx vitest run client/hooks/use-paged-project-versions.test.ts
