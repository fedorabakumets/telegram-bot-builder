# @fileoverview Проверка совмещённого и раздельного запуска и передачи аренды исполнителя без production.
name: Split runtime
on:
  push:
    paths:
      - 'frontend/**'
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'lib/**'
      - 'Dockerfile.*'
      - 'docker-compose.yml'
      - 'railway.*.toml'
      - 'scripts/*split*'
      - 'scripts/build-server.mjs'
      - 'vite.config.ts'
      - 'package*.json'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/split-runtime.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      LOCAL_DATABASE_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      LOCAL_REDIS_TEST_URL: redis://127.0.0.1:6379
      RUNNER_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s server/python -p 'test_polling_lifecycle.py' -v
      # Проверяем инвалидацию байткода и совместимость общих пространств имён моделей.
      - run: python -m unittest discover -s server/python -p 'test_bot_code_cache.py' -v
      # Проверяем холодную компиляцию вне рабочего процесса и восстановление повреждённого кеша.
      - run: python -m unittest discover -s server/python -p 'test_bot_code_compile_isolation.py' -v
      # Проверяем освобождение временных ссылок основного и соседних модулей загрузчика.
      - run: python -m unittest discover -s server/python -p 'test_worker_loader_memory.py' -v
      # Проверяем настоящий stdin воркера и изоляцию окружений при холодной компиляции.
      - run: python -m unittest discover -s server/python -p 'test_worker_overlay_process.py' -v
        env:
          BOT_CODE_CACHE: 'false'
      - run: python server/python/lazy_aiogram_namespace_test.py
      - run: python -m unittest discover -s server/python -p 'test_process_environment.py' -v
      - run: python scripts/local-process/test_windows_guard.py
      - run: python scripts/local-process/test_validate.py
      - run: python -m unittest discover -s lib/tests -p 'test_redis_lock_runtime.py' -v
      - run: node --import tsx --test server/bots/lazyAiogram.test.ts
      - run: node --import tsx --test shared/schema/zod-migration.test.ts
      - run: npm run build
      - run: npm run build:runtime
      - run: node --test frontend/*.test.mjs
      - run: node --import tsx --test scripts/vite-split.test.ts
      - run: npx vitest run --config server/runtime/vitest.config.ts
      - name: Аренда, команды и границы зависимостей исполнителя
        run: npx vitest run --config server/runner/vitest.config.ts
      # Адресно проверяем отключение диагностики, реальные сеансы V8 и формат снимков памяти.
      - name: Диагностика памяти исполнителя
        run: node --import tsx --test server/runner/runnerHeapProfile.test.ts server/runner/runnerMemoryLinux.test.ts server/runner/runnerMemoryMonitor.test.ts
      # Проверяем доставку между сервисами, секрет Telegram и читаемость безопасных журналов.
      - name: Доставка webhook и маскировка секретов
        run: node --import tsx --test server/runner/runnerWebhookServer.test.ts server/routes/telegramWebhookHandler.test.ts server/routes/telegramWebhookDelivery.test.ts server/routes/telegramWebhook.integration.test.ts server/bots/webhookBaseUrl.test.ts server/utils/secret-environment-key.test.ts
      - run: node --import tsx --test server/bots/webhookSecret.test.ts server/bots/generatedCodeFingerprint.test.ts server/runner/runnerWebhookProject.test.ts server/routes/botTokens/to-public-bot-token.test.ts
      - run: python -m unittest discover -s server/python -p 'test_log_redaction.py' -v
      - run: npx vitest run --project client client/components/editor/bot/card/use-bot-launch-settings.test.tsx client/components/editor/bot/card/BotLaunchSettings.test.tsx client/components/editor/bot/card/WebhookSecretReveal.test.tsx client/components/editor/bot/card/BotActions.test.tsx client/components/editor/bot/card/BotRuntimeModeSettings.test.tsx client/components/editor/bot/card/launch-history-utils.test.ts client/components/editor/bot/canvas/bot-canvas-status.test.ts
      # Проверяем отдельное авторизованное раскрытие секрета без кеширования и журналирования тела.
      - run: npx vitest run --config server/routes/botTokens/webhook-secret.vitest.config.ts
      # Проверяем удалённый статус истории и возможность остановки ограниченного Telegram бота.
      - run: npx vitest run --config server/routes/botManagement/status.vitest.config.ts
      # Проверяем независимость транспорта от времени жизни сценария и надёжную очередь webhook.
      - run: node --import tsx --test server/bots/runtimeModePolicy.test.ts server/bots/runtimeModeBatch.test.ts server/runner/polling/webhookIngress.test.ts server/runner/polling/webhookQueue.integration.test.ts server/runner/polling/webhookLifecycle.integration.test.ts
      - name: Потоки сборок, очистка кеша и обратное давление
        run: node --import tsx --test server/bots/workerChannel.test.ts server/runner/runnerBuildCache.test.ts server/runner/runnerBuildStream.test.ts server/runner/runnerCacheLifecycle.test.ts server/runner/runnerEventPublisher.test.ts
      # Приёмники проверяются на локальном HTTP-двойнике, без запросов к Telegram.
      - name: Приём обновлений в Node и владение очередью
        run: node --import tsx --test server/runner/polling/dispatcher.test.ts server/runner/polling/dispatcherLifecycle.test.ts server/runner/polling/dispatcherUnlimited.test.ts server/runner/polling/sharedTransport.test.ts server/runner/polling/dispatcherLease.test.ts server/runner/polling/dispatcherFailure.test.ts server/runner/polling/pythonChild.test.ts server/runner/polling/queue.integration.test.ts server/runner/polling/redisRecovery.integration.test.ts server/runner/polling/runtimeSettings.test.ts server/runner/polling/execution.test.ts server/runner/polling/testPython.test.ts server/runner/polling/memoryLedger.test.ts server/runner/runnerMemoryTotals.test.ts
      - run: npx vitest run --config server/runner/polling/vitest.config.ts
      - run: npx vitest run --config server/runner/polling/integration.vitest.config.ts
      # Общий обработчик и административные режимы проверяются при каждом изменении PR.
      - name: Жизненный цикл общего обработчика и статистика
        run: node --import tsx --test server/runner/polling/sharedHost.test.ts server/runner/polling/sharedHost.lifecycle.test.ts server/runner/polling/sharedHost.mixedLifecycle.test.ts server/runner/polling/sharedMemoryLedger.test.ts server/runner/polling/timingMetrics.test.ts server/runner/runnerBotModes.test.ts server/runner/runnerConfig.test.ts
      - run: npx vitest run --config server/runner/polling/shared.vitest.config.ts
        # Принудительно проверяем дочернюю компиляцию при каждом пробуждении, независимо от файлов кеша.
        env:
          BOT_CODE_CACHE: 'false'
      - name: Выбранные режимы и запросы администратора
        run: node --import tsx --test server/admin/worker-bot-mode-model.test.ts server/admin/worker-bot-request.test.ts server/admin/worker-bot-handler.test.ts server/admin/worker-inspection-cache.test.ts server/admin/runtime-worker-validation.test.ts server/admin/runtime-worker-view.test.ts
      - name: Интерфейс управления воркерами
        run: npx vitest run --project client client/components/admin/runtime/worker-bots-panel.test.tsx client/components/admin/runtime/worker-bot-row.test.tsx client/components/admin/runtime/worker-chart-points.test.ts client/components/admin/runtime/workers-settings-form.test.tsx client/components/admin/runtime/worker-group-list.test.tsx
      # Проверяет сохранность свежих событий и удаление метаданных истёкших ключей.
      - name: Очистка ключей счётчика событий
        run: npx vitest run --project lib lib/templates/rate-counter/rate-counter.test.ts lib/templates/utils/rate-housekeeping.test.ts

      # Проверяем сто активных сценариев без ограничения числа загруженных ботов.
      - run: python -m unittest discover -s server/python -p 'test_shared_worker_capacity.py' -v
      # Проверяет маршрутизацию постоянных и выгружаемых сценариев единого хоста.
      - run: python -m unittest discover -s server/python -p 'test_unified_sessions.py' -v
      - run: python -m unittest discover -s server/python -p 'test_worker_memory_profile.py' -v
      - run: node --import tsx --test server/redis/workerStreams.integration.test.ts
      - run: node scripts/smoke-split-build.mjs
      - run: node scripts/smoke-split-build.mjs --dev
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        service: [frontend, backend, runner]
    steps:
      - uses: actions/checkout@v4
      # Образы только собираются локально на runner, без публикации и деплоя.
      - run: docker build -f Dockerfile.${{ matrix.service }} -t botcraft-${{ matrix.service }}:check .
      # Результаты видны в журнале; найденные уязвимости не блокируют слияние.
      - name: Проверить образ на уязвимости
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: botcraft-${{ matrix.service }}:check
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
