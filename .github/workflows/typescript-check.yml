# @fileoverview Проверки типов, React Hooks и всех фаз генератора при пуше и в PR.
name: TypeScript check

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Проверяет освобождение структур памяти без Telegram, БД и секретов.
  memory-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Структурные регрессии памяти
        run: python scripts/memory-regression/run.py
      - name: Отмена и очистка блокировок
        run: python lib/tests/scoped-user-locks-runtime.py
      - name: Приватность и ограничения диагностики
        run: python -m unittest discover -s server/python -p test_worker_runtime_counters.py

  # Выясняет необходимость фаз без установки зависимостей.
  generator-phase-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.classify.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
        id: history
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main')
        continue-on-error: true
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Проверить полный список изменённых путей
        id: classify
        env:
          HISTORY_OUTCOME: ${{ steps.history.outcome }}
        run: |
          needed=true
          if [[ "$HISTORY_OUTCOME" == success ]] && result="$(python3 scripts/ci/generator-phase-paths.py)" && [[ "$result" == false ]]; then
            needed=false
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  generator-phase-shards:
    needs: generator-phase-plan
    if: ${{ !cancelled() && (needs.generator-phase-plan.result != 'success' || needs.generator-phase-plan.outputs.needed != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - name: Все фазовые тесты генератора
        run: npm run test:phases
        env:
          PHASE_TEST_SHARDS: '8'
          PHASE_TEST_SHARD: ${{ matrix.shard }}

  # Одно стабильное имя проверки для правил защиты ветки, включая штатный пропуск фаз.
  generator-phases:
    needs: [generator-phase-plan, generator-phase-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Подтвердить выполнение или штатный пропуск фаз
        env:
          PLAN_RESULT: ${{ needs.generator-phase-plan.result }}
          PHASES_NEEDED: ${{ needs.generator-phase-plan.outputs.needed }}
          SHARDS_RESULT: ${{ needs.generator-phase-shards.result }}
        run: |
          if [[ "$SHARDS_RESULT" == success ]]; then
            echo 'Фазовые тесты прошли.'
          elif [[ "$PLAN_RESULT" == success && "$PHASES_NEEDED" == false && "$SHARDS_RESULT" == skipped ]]; then
            echo 'Изменены только документированные пути интерфейса или документации.'
          else
            echo 'Обязательные фазовые тесты не завершились успешно.' >&2
            exit 1
          fi

  react-hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check React Hooks
        run: npm run check:hooks
      # Диагностика не должна раскрывать содержимое ботов или скрывать известные показатели.
      - name: Регрессии диагностики воркеров
        run: npx tsx --tsconfig tsconfig.node.json --test server/runner/runnerRuntimeCounters.test.ts server/admin/worker-runtime-counters.test.ts server/admin/worker-status-handler.test.ts server/admin/runtime/workerMetrics.test.ts server/admin/worker-runtime-groups.test.ts

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run check
