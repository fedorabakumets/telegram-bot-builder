# @fileoverview Проверки типов, React Hooks и всех фаз генератора при пуше и в PR.
name: TypeScript check

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Проверяет освобождение структур памяти без Telegram, БД и секретов.
  memory-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Структурные регрессии памяти
        run: python scripts/memory-regression/run.py
      - name: Отмена и очистка блокировок
        run: python lib/tests/scoped-user-locks-runtime.py
      - name: Приватность и ограничения диагностики
        run: python -m unittest discover -s server/python -p test_worker_runtime_counters.py

  generator-phases:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - name: Все фазовые тесты генератора
        run: npm run test:phases
        env:
          PHASE_TEST_SHARDS: '8'
          PHASE_TEST_SHARD: ${{ matrix.shard }}

  react-hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check React Hooks
        run: npm run check:hooks
      # Диагностика не должна раскрывать содержимое ботов или скрывать известные показатели.
      - name: Регрессии диагностики воркеров
        run: npx tsx --tsconfig tsconfig.node.json --test server/runner/runnerRuntimeCounters.test.ts server/admin/worker-runtime-counters.test.ts server/admin/worker-status-handler.test.ts server/admin/runtime/workerMetrics.test.ts server/admin/worker-runtime-groups.test.ts

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run check
