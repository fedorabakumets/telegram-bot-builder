# @fileoverview Конфигурация будущего отдельного исполнителя ботов; сервис Railway автоматически не создаётся.
# При назначении сервису задайте RUNNER_REQUIRE_FENCE=true и DATABASE_URL для защиты команд ботов.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.runner"
watchPatterns = ["/server/runner/**", "/server/redis/**", "/server/bots/**", "/server/services/runtime-overlay.ts", "/server/utils/**", "/server/python/**", "/requirements.txt", "/package.json", "/package-lock.json", "/tsconfig.node.json", "/Dockerfile.runner", "/railway.runtime.toml"]

[deploy]
startCommand = "node /app/runner.cjs"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
